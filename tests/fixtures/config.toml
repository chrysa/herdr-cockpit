# herdr config — Linux · zsh · Claude Code (perso, pro) + Codex.
# Generated by herdr-cockpit from cockpit/templates/config.toml: edit the template,
# then run `cockpit setup`. Only settings that differ from herdr's defaults are
# listed, plus two pinned on purpose (confirm_close, resume_agents_on_restore).

onboarding = false

[terminal]
default_shell = "zsh"

[theme]
auto_switch = true                    # follow the terminal's light/dark mode

[session]
resume_agents_on_restore = true       # pinned: agents come back after a server restart

[advanced]
scrollback_limit_bytes = 52428800     # 50 MB: agents print a lot

[experimental]
pane_history = true                   # keep pane output across a server restart

# ── Display ──────────────────────────────────────────────────────────────────

[ui]
agent_panel_sort = "spaces"           # agents grouped under their space
status_indicators = "symbols"         # distinct shapes per state, not only colors
confirm_close = true                  # pinned
# Right of the tab bar: account · model · context of the focused agent.
tab_bar_right = [
  { type = "command", command = "/b/herdr-tabbar", interval_seconds = 5, timeout_seconds = 2 },
]

# herdr's own toasts (agent done or waiting, clipboard copy), top right;
# desktop notifications and sounds off.
[ui.toast]
delivery = "herdr"
[ui.toast.herdr]
position = "top-right"
[ui.toast.clipboard]
position = "top-right"
[ui.sound]
enabled = false

# Spaces: state, name, branch, git; worktrees grouped natively; project RTK
# savings (chrysa.rtk-savings publishes only one of the four variants).
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  [{ token = "$rtk_hi", fg = "#a6e3a1" }, { token = "$rtk", fg = "#9399b2" },
   { token = "$rtk_low", fg = "#f38ba8" }, { token = "$rtk_sum", fg = "#9399b2" }],
]

# Agents: state + conversation title (Claude's own title, follows /rename,
# spinner stripped), then account, model and PR. The tab name is not used: it
# already carries the state icon (agent-info), which would show it twice.
[ui.sidebar.agents]
rows = [
  ["state_icon", "terminal_title_stripped"],
  [{ token = "$account", fg = "#9399b2", bold = true, rules = [
      { equals = "perso", fg = "#f9e2af" },
      { equals = "pro", fg = "#89dceb" },
      { equals = "codex", fg = "#a6e3a1" },
    ] },
   { token = "$model", fg = "#cba6f7" },
   { token = "$pr", fg = "#89dceb" }],
]

# Codex has no Claude account: model and PR only.
[ui.sidebar.agents.rows_by_agent]
codex = [
  ["state_icon", "terminal_title_stripped"],
  [{ token = "$model", fg = "#cba6f7" }, { token = "$pr", fg = "#89dceb" }],
]

# ── Keys ─────────────────────────────────────────────────────────────────────
# Two prefixes: ctrl+b and ctrl+space. `prefix+?` lists every binding below.
# alt chords are avoided for custom commands (alt sends ESC in xterm);
# prefix+r stays herdr's resize mode.

[keys]
prefix = ["ctrl+b", "ctrl+space"]
clear_pane = "prefix+ctrl+l"          # clear screen and scrollback, keep the prompt
focus_agent = "prefix+alt+1..9"
next_agent = "prefix+shift+j"
previous_agent = "prefix+shift+k"
switch_workspace = "prefix+shift+1..9"

# Agents column filters (chrysa.cockpit, native agent.view.set; they combine).
[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "chrysa.cockpit.agents-profile"
description = "agents: next Claude profile (all, perso, pro…)"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "chrysa.cockpit.agents-active"
description = "agents: active only (working, blocked)"

[[keys.command]]
key = "prefix+ctrl+x"
type = "plugin_action"
command = "chrysa.cockpit.agents-space"
description = "agents: selected space only"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "chrysa.cockpit.agents-sort"
description = "agents: sort by attention / by space"

[[keys.command]]
key = "prefix+ctrl+z"
type = "plugin_action"
command = "chrysa.cockpit.agents-reset"
description = "agents: show all"

# Panels and panes.
[[keys.command]]
key = "prefix+ctrl+t"
type = "plugin_action"
command = "agent-panel.toggle"
description = "panel: conversation (agent-panel) show / hide"

[[keys.command]]
key = "prefix+ctrl+g"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin chrysa.agent-info --entrypoint services --placement split --direction down --no-focus'
description = "pane: project services (containers, ports, URLs)"

[[keys.command]]
key = "prefix+ctrl+r"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin chrysa.rtk-savings --entrypoint savings'
description = "pane: RTK savings"

[[keys.command]]
key = "ctrl+shift+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "pane: usage limits (5h / 7d / 30d per account)"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "usage: refresh sidebar meters"

# Review and files.
[[keys.command]]
key = "prefix+ctrl+v"
type = "shell"
command = '''n="rev-$(date +%H%M%S)"; p=$("$HERDR_BIN_PATH" pane split --current --direction right --no-focus | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['pane']['pane_id'])") && "$HERDR_BIN_PATH" agent start "$n" --kind codex --pane "$p" && "$HERDR_BIN_PATH" agent prompt "$n" "Review the current git diff and report only actionable findings."'''
description = "review: Codex reviews the diff in a split"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "review: diff sidebar (reviewr)"

[[keys.command]]
key = "prefix+ctrl+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "files: viewer in a tab"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "files: viewer in a split"

# Navigation and worktrees.
[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator: fuzzy jump"

[[keys.command]]
key = "prefix+ctrl+n"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "navigator: side pane"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "navigator: jump back"

[[keys.command]]
key = "prefix+shift+w"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree: switch / create (worktrunk)"

[[keys.command]]
key = "prefix+ctrl+w"
type = "plugin_action"
command = "worktrunk.remove"
description = "worktree: remove (worktrunk)"

# Transcripts.
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "nicosuave.memex.palette"
description = "memex: search transcripts"

[[keys.command]]
key = "prefix+ctrl+e"
type = "plugin_action"
command = "nicosuave.memex.toggle"
description = "memex: sidebar show / hide"
