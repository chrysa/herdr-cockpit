# herdr config — Linux · zsh · Claude Code (perso, pro) + Codex.
# Generated by herdr-cockpit from cockpit/templates/config.toml: edit the template,
# then run `cockpit setup`. Only settings that differ from herdr's defaults are
# listed, plus two pinned on purpose (confirm_close, resume_agents_on_restore).

onboarding = false

[terminal]
default_shell = "zsh"

[theme]
auto_switch = true                    # follow the terminal's light/dark mode

[session]
resume_agents_on_restore = true       # pinned: agents come back after a server restart

[advanced]
scrollback_limit_bytes = 52428800     # 50 MB: agents print a lot

[experimental]
pane_history = true                   # keep pane output across a server restart

# ── Display ──────────────────────────────────────────────────────────────────

[ui]
sidebar_width = 40                    # the longest folder name fits on an indented line
sidebar_max_width = 40                # herdr caps the width at 36 by default
agent_panel_sort = "priority"         # attention queue, the order agent_view also uses
status_indicators = "symbols"         # distinct shapes per state, not only colors
pane_borders = "off"                  # no frame or title around split panes (agent-panel
                                      # splits every agent tab); the tab name carries the subject
confirm_close = true                  # pinned
# Right of the tab bar: account · model · context of the focused agent.
tab_bar_right = [
  { type = "command", command = "/b/herdr-tabbar", interval_seconds = 5, timeout_seconds = 2 },
]

# herdr's own toasts (agent done or waiting, clipboard copy), top right;
# desktop notifications and sounds off.
[ui.toast]
delivery = "herdr"
[ui.toast.herdr]
position = "top-right"
[ui.toast.clipboard]
position = "top-right"
[ui.sound]
enabled = false

# Spaces, compact:
#   1. state icon only when an agent there works, waits on you or has finished
#      (agent-info's space_icon: herdr's state_icon also marks idle spaces), in
#      its own color ([states]: ‼ red, ◐ peach, ✓ mauve, never an account color;
#      ⑂ blue when only subagents, workflow agents or background tasks work),
#      then the name. Active (an agent works, waits or has finished): bold, in
#      the color of the account most of its agents run under (pro, perso; else
#      plain text). Idle: dim grey, so active spaces stand out; an idle-only
#      count ("○2") is dim grey too. A space whose folder sits in another
#      space's folder (plateform_socle in Forge-Stack-Workshop/), else named
#      after another plus "-suffix" (padam-av-GHA), is its child: spaces form a
#      tree in alphabetical order at every level ("├ GHA", "└ simul"), and
#      agent-info moves them into that order (no list by hand). A child's icon
#      comes after its name ("│ ├ GHA · ◐", child_icon): herdr puts " · " after
#      every custom token, so an icon in front would push the tree glyphs right.
#      agent-info publishes the name under one of six tokens (busy/idle x
#      ecosystem) because herdr row styles are static and rules only match a
#      token's own value; on the same line, the agents and subagents counted
#      per state ("‼1 ◐2 ○1 ⑂●2✓1"; ⑂ = subagents, ● running ◌ stalled
#      ✗ failed ⊘ killed ✓ done), one group per account in its color;
#      idle agents counted too ("○2"), also where every agent sits idle;
#   0. above line 1, on the first space of a sibling group only: the group's
#      header, dim grey ("└ plateform" over "├ charts", "├ service_catalog",
#      "└ socle": children whose names start with the same word, one letter of
#      difference allowed); the members drop that word and sit one level deeper;
#   2+. only the agents waiting on you (blocked), one red "‼ subject" line
#      each, longest wait first, at most 3 then "+N en attente". Every other
#      agent is in the Agents column, so no space line reads like an agent.
# RTK savings are not shown here: they stay in the RTK pane (prefix+ctrl+r) and
# the Claude status line.
# Line 1 always has a value; herdr drops empty rows, so a space with nobody
# waiting takes one line.
[ui.sidebar.spaces]
rows = [
  [{ token = "$group_pro", fg = "#9399b2", dim = true }, { token = "$group_perso", fg = "#9399b2", dim = true },
   { token = "$group_other", fg = "#9399b2", dim = true }],
  [{ token = "$space_icon", bold = true, rules = [{ equals = "‼", fg = "#f38ba8" },
     { equals = "◐", fg = "#fab387" }, { equals = "✓", fg = "#cba6f7" },
     { equals = "⑂", fg = "#89b4fa" }] },
   { token = "$space_busy_pro", fg = "#89dceb", bold = true }, { token = "$space_busy_perso", fg = "#f9e2af", bold = true },
   { token = "$space_busy_other", fg = "#cdd6f4", bold = true },
   { token = "$space_idle_pro", fg = "#9399b2", dim = true }, { token = "$space_idle_perso", fg = "#9399b2", dim = true },
   { token = "$space_idle_other", fg = "#9399b2", dim = true },
   { token = "$child_icon", bold = true, rules = [{ equals = "‼", fg = "#f38ba8" },
     { equals = "◐", fg = "#fab387" }, { equals = "✓", fg = "#cba6f7" },
     { equals = "⑂", fg = "#89b4fa" }] },
   { token = "$count_perso", fg = "#f9e2af", rules = [{ starts_with = "○", fg = "#9399b2", dim = true }] },
   { token = "$count_pro", fg = "#89dceb", rules = [{ starts_with = "○", fg = "#9399b2", dim = true }] },
   { token = "$count_codex", fg = "#a6e3a1", rules = [{ starts_with = "○", fg = "#9399b2", dim = true }] },
   { token = "$count_other", fg = "#9399b2", rules = [{ starts_with = "○", dim = true }] }],
  [{ token = "$wait1", fg = "#f38ba8" }],
  [{ token = "$wait2", fg = "#f38ba8" }],
  [{ token = "$wait3", fg = "#f38ba8" }],
  [{ token = "$wait_more", fg = "#f38ba8", dim = true }],
]

# Agents: a state icon only when the agent works, waits on you or has finished,
# or when only its subtasks run (agent-info's agent_icon, colored as on spaces:
# herdr's state_icon also marks idle agents), how long in that state (dim,
# "12m"; agent-info measures it), the branch's PR (gh-pr, "#123 ✓"), then the
# name (the tab's, else the conversation title) in the color of its account
# (perso yellow, pro sky, codex green, other grey), or dim grey when the agent
# is idle (topic_idle). agent-info publishes the title under one token per
# account because herdr rules can only match a token's own value. A working
# Claude agent gets a dim second line with its last tool call ("Edit
# monitor.py"), then one mauve line per subtask: subagent, /subtask fork,
# workflow agent or background task ("⑂ ● Security review"), finished ones for
# 30 min, unfinished ones up to 6 h; 13 max (herdr allows 16 rows) then "⑂ +N".
# No space name: the column shows the selected space by default (agent_view),
# so the whole width goes to the title.
# The model is in the tab bar and the panel header, not repeated here.
[ui.sidebar.agents]
rows = [
  [{ token = "$agent_icon", bold = true, rules = [{ equals = "‼", fg = "#f38ba8" },
     { equals = "◐", fg = "#fab387" }, { equals = "✓", fg = "#cba6f7" },
     { equals = "⑂", fg = "#89b4fa" }] },
   { token = "$age", dim = true }, { token = "$pr", fg = "#9399b2" },
   { token = "$topic_perso", fg = "#f9e2af" }, { token = "$topic_pro", fg = "#89dceb" },
   { token = "$topic_codex", fg = "#a6e3a1" }, { token = "$topic_other", fg = "#9399b2" },
   { token = "$topic_idle", fg = "#9399b2", dim = true }],
  [{ token = "$doing", dim = true }],
  [{ token = "$sub1", fg = "#cba6f7" }],
  [{ token = "$sub2", fg = "#cba6f7" }],
  [{ token = "$sub3", fg = "#cba6f7" }],
  [{ token = "$sub4", fg = "#cba6f7" }],
  [{ token = "$sub5", fg = "#cba6f7" }],
  [{ token = "$sub6", fg = "#cba6f7" }],
  [{ token = "$sub7", fg = "#cba6f7" }],
  [{ token = "$sub8", fg = "#cba6f7" }],
  [{ token = "$sub9", fg = "#cba6f7" }],
  [{ token = "$sub10", fg = "#cba6f7" }],
  [{ token = "$sub11", fg = "#cba6f7" }],
  [{ token = "$sub12", fg = "#cba6f7" }],
  [{ token = "$sub13", fg = "#cba6f7" }],
  [{ token = "$sub_more", fg = "#cba6f7", dim = true }],
]

# ── Keys ─────────────────────────────────────────────────────────────────────
# Two prefixes: ctrl+b and ctrl+space. `prefix+?` lists every binding below.
# Every custom key sits behind the prefix, so panes get all other keys.
# alt chords are avoided for custom commands (alt sends ESC in xterm);
# prefix+r stays herdr's resize mode, prefix+shift+r its config reload.
# A key taken from a herdr default is said so, and that action is moved here:
# herdr drops a shadowed default without any warning.

[keys]
prefix = ["ctrl+b", "ctrl+space"]
clear_pane = "prefix+ctrl+l"          # clear screen and scrollback, keep the prompt
focus_agent = "prefix+alt+1..9"
next_agent = "prefix+shift+j"         # herdr default: swap_pane_down
previous_agent = "prefix+shift+k"     # herdr default: swap_pane_up
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
switch_workspace = "prefix+shift+1..9"
new_workspace = "prefix+shift+c"      # its default prefix+shift+n is the navigator
open_worktree = "prefix+ctrl+w"       # native worktrees (unset by default); new_worktree = prefix+shift+g
remove_worktree = "prefix+alt+w"      # asks for confirmation

# Agents column filters (chrysa.cockpit, native agent.view.set; they combine).
[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "chrysa.cockpit.agents-profile"
description = "agents: next Claude profile (all, perso, pro…)"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "chrysa.cockpit.agents-active"
description = "agents: active only (working, blocked)"

[[keys.command]]
key = "prefix+ctrl+x"
type = "plugin_action"
command = "chrysa.cockpit.agents-space"
description = "agents: selected space only"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "chrysa.cockpit.agents-sort"
description = "agents: sort by attention / by space"

[[keys.command]]
key = "prefix+ctrl+z"
type = "plugin_action"
command = "chrysa.cockpit.agents-reset"
description = "agents: show all"

# Panels and panes.
[[keys.command]]
key = "prefix+ctrl+t"
type = "plugin_action"
command = "agent-panel.toggle"
description = "panel: conversation (agent-panel) show / hide"

[[keys.command]]
key = "prefix+ctrl+g"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin chrysa.agent-info --entrypoint services --placement split --direction down --no-focus'
description = "pane: project services (containers, ports, URLs)"

[[keys.command]]
key = "prefix+ctrl+r"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin chrysa.rtk-savings --entrypoint savings'
description = "pane: RTK savings"

[[keys.command]]
key = "prefix+shift+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "pane: usage limits (5h / 7d / 30d per account)"

[[keys.command]]
key = "prefix+ctrl+u"
type = "plugin_action"
command = "usagebar.refresh"
description = "usage: refresh sidebar meters"

# Review and files.
[[keys.command]]
key = "prefix+ctrl+v"
type = "shell"
command = '''n="rev-$(date +%H%M%S)"; p=$("$HERDR_BIN_PATH" pane split --current --direction right --no-focus | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['pane']['pane_id'])") && "$HERDR_BIN_PATH" agent start "$n" --kind codex --pane "$p" && "$HERDR_BIN_PATH" agent prompt "$n" "Review the current git diff and report only actionable findings."'''
description = "review: Codex reviews the diff in a split"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "review: diff sidebar (reviewr)"

[[keys.command]]
key = "prefix+ctrl+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "files: viewer in a tab"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "files: viewer in a split"

# Navigation and worktrees.
[[keys.command]]
key = "prefix+shift+n"                # herdr default: new_workspace
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator: fuzzy jump"

[[keys.command]]
key = "prefix+ctrl+n"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "navigator: side pane"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "navigator: jump back"

# Transcripts.
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "nicosuave.memex.palette"
description = "memex: search transcripts"

[[keys.command]]
key = "prefix+ctrl+e"
type = "plugin_action"
command = "nicosuave.memex.toggle"
description = "memex: sidebar show / hide"
