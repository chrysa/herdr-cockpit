id = "chrysa.agent-info"
name = "Agent Info"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "Shows per agent pane the Claude account ($account), the LLM model ($model), the in-progress task ($doing) and the task tally ($todo), read from local session transcripts. Local reads only - no network, no telemetry."
platforms = ["macos", "linux"]

[[actions]]
id = "start"
title = "Model badge: start monitor"
contexts = ["workspace"]
command = ["python3", "monitor.py", "ensure"]

[[actions]]
id = "stop"
title = "Model badge: stop monitor"
contexts = ["workspace"]
command = ["python3", "monitor.py", "stop"]

[[events]]
on = "workspace.created"
command = ["python3", "monitor.py", "ensure"]

[[events]]
on = "pane.created"
command = ["python3", "monitor.py", "ensure"]

[[events]]
on = "workspace.focused"
command = ["python3", "monitor.py", "ensure"]

# Right-hand info pane: account, model, limits, context and tasks per agent.
[[panes]]
id = "info"
title = "info"
placement = "split"
command = ["python3", "info.py"]

[[actions]]
id = "toggle-info"
title = "Info: toggle right pane"
contexts = ["pane", "workspace"]
command = ["sh", "toggle-info.sh"]

# Start with the server so the sidebar is populated right after a restart.
[[startup]]
platforms = ["linux", "macos"]
command = ["python3", "monitor.py", "ensure"]
