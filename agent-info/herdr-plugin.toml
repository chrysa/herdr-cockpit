id = "chrysa.agent-info"
name = "Agent Info"
version = "0.4.0"
min_herdr_version = "0.7.0"
description = "Publishes the Claude account ($account) and LLM model ($model) of each agent pane for the sidebar, and a pane listing the tab project's containers and listening ports with their URLs. Local reads only - no network, no telemetry."
platforms = ["macos", "linux"]

[[startup]]
platforms = ["linux", "macos"]
command = ["python3", "monitor.py", "ensure"]

[[events]]
on = "pane.created"
command = ["python3", "monitor.py", "ensure"]

[[actions]]
id = "stop"
title = "Agent info: stop the token monitor"
contexts = ["workspace"]
command = ["python3", "monitor.py", "stop"]

# Containers and listening processes of the tab's git project, with URLs.
[[panes]]
id = "services"
title = "services"
placement = "split"
command = ["python3", "services_pane.py"]
