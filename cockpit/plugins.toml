# Every herdr plugin this setup expects, pinned (`synapse`: the manifest is complete).
# `cockpit setup` installs what is missing and applies `enabled`; `cockpit status` reports
# version drift and plugins installed but not listed here. Nothing is ever uninstalled.
# chrysa/* plugins may be linked from a local checkout instead (`herdr plugin link`).

[[plugin]]
id = "chrysa.agent-info"
source = "chrysa/herdr-cockpit/agent-info"
ref = "v0.8.0"
enabled = true

[[plugin]]
id = "chrysa.cockpit"
source = "chrysa/herdr-cockpit/cockpit"
ref = "v0.8.0"
enabled = true

[[plugin]]
id = "chrysa.rtk-savings"
source = "chrysa/herdr-rtk-savings"
enabled = true

[[plugin]]
id = "gh-pr"
source = "wyattjoh/herdr-plugin-gh-pr"
ref = "6fe22de9a90c569f2186595cfddc3707f55ba1bd"
enabled = true

[[plugin]]
id = "herdr-file-viewer"
source = "smarzban/herdr-file-viewer"
ref = "4c2add6d952e81abc9ba4bbb9ff90107a626098c"
enabled = true

[[plugin]]
id = "herdr-navigator"
source = "thanhdat77/herdr-navigator"
ref = "e12a97c5d9ddcd76ba18c985909ffeb4827afa6a"
enabled = true

[[plugin]]
id = "herdr.auto-title"
source = "kryptamine/herdr-auto-title"
ref = "d8603171bde954fa2db57bf6013c548daa6f58c1"  # v0.20.0
enabled = true

[[plugin]]
id = "llmtrim.proxy"
source = "fkiene/llmtrim-herdr"
ref = "88ed6fbeab1cfc1224bece3744b207659bc1123b"
enabled = true

[[plugin]]
id = "nicosuave.memex"
source = "nicosuave/memex"
ref = "4c8d37dc5092c5f82a8de2ffe597a9bb3f5c9fda"
enabled = true

[[plugin]]
id = "ntindle.herdr-resurrect"
source = "ntindle/herdr-resurrect"
ref = "461e866cc772e156e39b94d085701972e24761af"
enabled = true

[[plugin]]
id = "persiyanov.reviewr"
source = "persiyanov/herdr-reviewr"
ref = "92c51e2bd4e2caf42fa00bc193ae2f48955df64f"
enabled = true

[[plugin]]
id = "usagebar"
source = "senna-lang/herdr-agent-usage"
ref = "063ff7bf03979fc1b1498bd6dec422175655c01b"
enabled = true

[[plugin]]
id = "agent-panel"
source = "chrysa/agent-panel"  # fork of flowy11/agent-panel: header lines, shown marker, kept width, tab clicks, Made/Apps tabs, real-time redraw, Nerd Font pictograms
ref = "2cea2f56666054820c7ef6d7bd5abc25ecceaa02"
enabled = true

[[plugin]]
id = "bcihanc.claude-session-title"
source = "bcihanc/herdr-claude-session-title"
ref = "b718bb1daa7c575978faf29339bc7596ae103483"
enabled = true
