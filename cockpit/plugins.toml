# Every herdr plugin this setup expects, pinned (`synapse`: the manifest is complete).
# `cockpit setup` installs what is missing and applies `enabled`; `cockpit status` reports
# version drift and plugins installed but not listed here. Nothing is ever uninstalled.
# chrysa/* plugins may be linked from a local checkout instead (`herdr plugin link`).

[[plugin]]
id = "chrysa.agent-info"
source = "chrysa/herdr-cockpit/agent-info"
ref = "v0.7.0"
enabled = true

[[plugin]]
id = "chrysa.cockpit"
source = "chrysa/herdr-cockpit/cockpit"
ref = "v0.7.0"
enabled = true

[[plugin]]
id = "chrysa.rtk-savings"
source = "chrysa/herdr-rtk-savings"
enabled = true

[[plugin]]
id = "gh-pr"
source = "wyattjoh/herdr-plugin-gh-pr"
ref = "6fe22de9a90c569f2186595cfddc3707f55ba1bd"
enabled = true

[[plugin]]
id = "herdr-file-viewer"
source = "smarzban/herdr-file-viewer"
ref = "78441da81e63d5fc416ab63fa99d006161595523"
enabled = true

[[plugin]]
id = "herdr-navigator"
source = "thanhdat77/herdr-navigator"
ref = "9bdf30f03f53730e6232377a3fca3bdc6ed9f3ca"
enabled = true

[[plugin]]
id = "herdr.auto-title"
source = "kryptamine/herdr-auto-title"
ref = "7fcec810280696b8b38b5bd884be2b340c73e02b"
enabled = true

[[plugin]]
id = "llmtrim.proxy"
source = "fkiene/llmtrim-herdr"
ref = "88ed6fbeab1cfc1224bece3744b207659bc1123b"
enabled = true

[[plugin]]
id = "nicosuave.memex"
source = "nicosuave/memex"
ref = "ecb846dd76195fb07ab94f3077308d68290df65a"
enabled = true

[[plugin]]
id = "ntindle.herdr-resurrect"
source = "ntindle/herdr-resurrect"
ref = "461e866cc772e156e39b94d085701972e24761af"
enabled = true

[[plugin]]
id = "persiyanov.reviewr"
source = "persiyanov/herdr-reviewr"
ref = "4c090225af706bf3aaa24b39fea890a72994f40f"
enabled = true

[[plugin]]
id = "usagebar"
source = "senna-lang/herdr-agent-usage"
ref = "517ee5e207c162aeb7c2cc8358084691e56ec0a5"
