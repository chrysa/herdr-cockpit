# ──────────────────────────────────────────────
#  herdr config.toml — Linux · zsh · Claude Code + Codex
#  Généré le 31/07/2026
# ──────────────────────────────────────────────

# Skip le first-run onboarding
onboarding = false

# ── Terminal ──
[terminal]
default_shell = "zsh"

# ── Raccourcis (préfixe tmux-style) ──
[keys]
prefix = "ctrl+b"

# Navigation agent : file d'attention (agent_panel_sort = "priority")
focus_agent = "prefix+alt+1..9"
next_agent = "prefix+shift+j"
previous_agent = "prefix+shift+k"
switch_workspace = "prefix+shift+1..9"

# ── Thème : bascule clair/sombre selon le terminal ──
[theme]
auto_switch = true

# ── UI / Sidebar ──
[ui]
# Right of the tab bar: account · model · plan/context of the focused agent (cockpit/bin/herdr-tabbar).
tab_bar_right = [
  { type = "command", command = "{{paths.bin}}/herdr-tabbar", interval_seconds = 5, timeout_seconds = 2 },
]
# Agents groupés sous leur space (natif) : c'est le filtre par space de herdr.
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = false
confirm_close = true

status_indicators = "symbols"
# ── Notifications herdr (dans la fenêtre, pas celles du système), en haut à droite :
#    agent qui a fini ou qui attend une réponse, et copie dans le presse-papiers ──
[ui.toast]
delivery = "herdr"
[ui.toast.herdr]
position = "top-right"
[ui.toast.clipboard]
position = "top-right"

# ── Session : reprend les agents après redémarrage ──
[session]
resume_agents_on_restore = true

# ── Avancé : scrollback 50 Mo (les agents produisent beaucoup de sortie) ──
[advanced]
scrollback_limit_bytes = 52428800

# ── Sons : coupés (notifications = toast système uniquement) ──
[ui.sound]
enabled = false

# ── Expérimental : conserve l'historique pane à travers un restart serveur
#    (les agents peignent en alternate screen → sinon sortie perdue) ──
[experimental]
pane_history = true

# ── Sidebar spaces : lignes natives (état, nom, branche, git ; worktrees groupés nativement) ──
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

# ── Sidebar agents : titre (auto-title / claude-session-title), compte coloré, modèle, PR (gh-pr) ──
[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$title"],
  [{ token = "$account", fg = "{{accounts.other}}", bold = true, rules = [
      { equals = "perso", fg = "{{accounts.perso}}" },
      { equals = "pro", fg = "{{accounts.pro}}" },
      { equals = "codex", fg = "{{accounts.codex}}" },
    ] },
   { token = "$model", fg = "{{colors.mauve}}" },
   { token = "$pr", fg = "{{colors.sky}}" }],
]

# prefix+r est pris par resize_mode (builtin) → déplacé sur prefix+ctrl+r (alt évité : envoie ESC en xterm)
[[keys.command]]
key = "prefix+ctrl+r"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin chrysa.rtk-savings --entrypoint savings'

# usagebar : pane limites (5h/7d/30d par compte) + refresh manuel
[[keys.command]]
key = "ctrl+shift+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "ctrl+shift+m"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"

# ── Plugins review/fichiers (ajout 2026-09-12) ──
[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle diff/review sidebar"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "file-viewer: split pane"

[[keys.command]]
key = "prefix+ctrl+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "file-viewer: onglet dédié"

# ── Multi-agents ──

[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator: fuzzy jump"

[[keys.command]]
key = "prefix+ctrl+n"
type = "plugin_action"
command = "herdr-navigator.open-side"
description = "navigator: side pane"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "herdr-navigator.jump-back"
description = "navigator: jump back"

# ── Worktrees ──
[[keys.command]]
key = "prefix+shift+w"
type = "plugin_action"
command = "worktrunk.open"
description = "worktrunk: switch/create worktree"

[[keys.command]]
key = "prefix+ctrl+w"
type = "plugin_action"
command = "worktrunk.remove"
description = "worktrunk: remove worktree"

# ── Transcripts ──
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "nicosuave.memex.palette"
description = "memex: session palette (search transcripts)"

[[keys.command]]
key = "prefix+ctrl+e"
type = "plugin_action"
command = "nicosuave.memex.toggle"
description = "memex: toggle sidebar"

# ── Reviewer : split + agent codex qui revoit le diff courant (ajout 2026-10-04) ──
[[keys.command]]
key = "prefix+ctrl+v"
type = "shell"
command = '''n="rev-$(date +%H%M%S)"; p=$("$HERDR_BIN_PATH" pane split --current --direction right --no-focus | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['pane']['pane_id'])") && "$HERDR_BIN_PATH" agent start "$n" --kind codex --pane "$p" && "$HERDR_BIN_PATH" agent prompt "$n" "Review the current git diff and report only actionable findings."'''
description = "reviewer: codex revoit le diff dans un split"


# ── Services du projet de l'onglet (conteneurs, ports, URL) : chrysa.agent-info ──
[[keys.command]]
key = "prefix+ctrl+g"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin chrysa.agent-info --entrypoint services --placement split --direction down --no-focus'
description = "services du projet (conteneurs, ports, URL)"

# ── Agents : tri natif par attention / ordre des spaces (agent.view.set, sans toucher la config) ──
[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "chrysa.cockpit.agents-sort"
description = "agents : tri par attention / par space"

# ── Filtres de la colonne Agents native (chrysa.cockpit, agent.view.set) ──
[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "chrysa.cockpit.agents-profile"
description = "agents : profil Claude suivant (tous, perso, pro…)"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "chrysa.cockpit.agents-active"
description = "agents : seulement les actifs (en cours, bloqués)"

[[keys.command]]
key = "prefix+ctrl+x"
type = "plugin_action"
command = "chrysa.cockpit.agents-space"
description = "agents : seulement le space sélectionné"

[[keys.command]]
key = "prefix+ctrl+z"
type = "plugin_action"
command = "chrysa.cockpit.agents-reset"
description = "agents : tout afficher"
