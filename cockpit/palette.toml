# Single source of colors for every cockpit surface (herdr sidebar, info bar,
# Claude Code status line, opencode theme). Catppuccin Mocha.

[colors]
blue = "#89b4fa"
green = "#a6e3a1"
yellow = "#f9e2af"
red = "#f38ba8"
mauve = "#cba6f7"
peach = "#fab387"
teal = "#94e2d5"
pink = "#f5c2e7"
sky = "#89dceb"
overlay = "#9399b2"

# Project color slots, in order (chrysa.spaces assigns one per ecosystem).
slots = ["blue", "green", "yellow", "red", "mauve", "peach", "teal", "pink"]

# One fixed color per account, everywhere an account is shown.
[accounts]
perso = "#f9e2af"
pro = "#89dceb"
codex = "#a6e3a1"
other = "#9399b2"

[roles]
done = "green"
subagents = "sky"
muted = "overlay"
