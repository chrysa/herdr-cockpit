id = "chrysa.cockpit"
name = "Cockpit"
version = "0.7.0"
min_herdr_version = "0.9.0"
description = "Owns the herdr configuration: one palette rendered into herdr, Claude Code and opencode surfaces. setup and status arrive in the next releases."
platforms = ["macos", "linux"]

[[actions]]
id = "status"
title = "Cockpit: status (drift report)"
contexts = ["workspace"]
command = ["sh", "-c", "python3 status.py | ${PAGER:-less -R}"]

[[actions]]
id = "setup"
title = "Cockpit: setup (install or repair)"
contexts = ["workspace"]
command = ["sh", "-c", "python3 setup.py | ${PAGER:-less -R}"]

# Filters for herdr's native Agents column (agent.view.set), re-applied at startup.
[[startup]]
platforms = ["linux", "macos"]
command = ["python3", "agent_view.py", "apply"]

# herdr forgets the view when its server restarts; re-applied on every space switch
# too (idempotent), so a missed startup run never leaves the column unfiltered.
[[events]]
on = "workspace.focused"
command = ["python3", "agent_view.py", "apply"]

[[actions]]
id = "agents-profile"
title = "Agents: next Claude profile (all, perso, pro…)"
contexts = ["global"]
command = ["python3", "agent_view.py", "profile"]

[[actions]]
id = "agents-active"
title = "Agents: only active (working, blocked) on/off"
contexts = ["global"]
command = ["python3", "agent_view.py", "active"]

[[actions]]
id = "agents-space"
title = "Agents: only the selected space on/off"
contexts = ["global"]
command = ["python3", "agent_view.py", "space"]

[[actions]]
id = "agents-sort"
title = "Agents: sort by attention / by space order"
contexts = ["global"]
command = ["python3", "agent_view.py", "sort"]

[[actions]]
id = "agents-reset"
title = "Agents: show every agent"
contexts = ["global"]
command = ["python3", "agent_view.py", "reset"]
