id = "chrysa.cockpit"
name = "Cockpit"
version = "0.8.0"
min_herdr_version = "0.9.0"
description = "Owns the herdr configuration: one palette rendered into herdr, Claude Code and opencode surfaces; setup, status and validate; the plugin manifest; filters for the native Agents column."
platforms = ["linux"]

[[actions]]
id = "status"
title = "Cockpit: status (drift report)"
contexts = ["workspace"]
command = ["sh", "-c", "python3 status.py | ${PAGER:-less -R}"]

[[actions]]
id = "setup"
title = "Cockpit: setup (install or repair)"
contexts = ["workspace"]
command = ["sh", "-c", "python3 setup.py | ${PAGER:-less -R}"]

# Filters for herdr's native Agents column (agent.view.set), re-applied at startup.
[[startup]]
platforms = ["linux"]
command = ["python3", "agent_view.py", "apply"]

# herdr forgets the view when its server restarts. On a space switch, `refresh`
# re-applies it only if the server changed since the last apply: setting a view
# resets the Agents column (selection included), so not on every switch.
[[events]]
on = "workspace.focused"
command = ["python3", "agent_view.py", "refresh"]

[[actions]]
id = "agents-profile"
title = "Agents: next Claude profile (all, perso, pro…)"
contexts = ["global"]
command = ["python3", "agent_view.py", "profile"]

[[actions]]
id = "agents-active"
title = "Agents: only active (working, blocked) on/off"
contexts = ["global"]
command = ["python3", "agent_view.py", "active"]

[[actions]]
id = "agents-space"
title = "Agents: only the selected space on/off"
contexts = ["global"]
command = ["python3", "agent_view.py", "space"]

[[actions]]
id = "agents-collapse"
title = "Agents: fold or unfold the focused space"
contexts = ["global"]
command = ["python3", "agent_view.py", "collapse"]

[[actions]]
id = "agents-attention"
title = "Agents: focus the first agent waiting on you in this space"
contexts = ["global"]
command = ["python3", "agent_view.py", "attention"]

[[actions]]
id = "agents-sort"
title = "Agents: sort by attention / by space order"
contexts = ["global"]
command = ["python3", "agent_view.py", "sort"]

[[actions]]
id = "agents-reset"
title = "Agents: show every agent"
contexts = ["global"]
command = ["python3", "agent_view.py", "reset"]
