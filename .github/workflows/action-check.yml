"on":
  pull_request:
    paths:
      - .github/actionlint.yaml
      - .github/workflows/**
  push:
    branches:
      - develop
      - main
      - master
    paths:
      - .github/workflows/**
jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@3a24062651993d40fed1019b58ac6fbdfbf276cc
        with:
          matcher: true
name: Actionlint
permissions:
  contents: read
