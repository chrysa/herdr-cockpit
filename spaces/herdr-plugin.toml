id = "chrysa.spaces"
name = "Spaces"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Readable space rows: colored agent-count chip per space, worktree list when a space spans several worktrees, and a matching color dot on every agent so spaces and their agents read as one group. Pure local socket reads - no network, no telemetry."
platforms = ["macos", "linux"]

[[actions]]
id = "start"
title = "Spaces: start monitor"
contexts = ["workspace"]
command = ["python3", "monitor.py", "ensure"]

[[actions]]
id = "stop"
title = "Spaces: stop monitor"
contexts = ["workspace"]
command = ["python3", "monitor.py", "stop"]

# Auto-start on any session activity so the monitor survives a server restart
# without manual action. `ensure` is a cheap pid/lock check when already alive.
[[events]]
on = "workspace.created"
command = ["python3", "monitor.py", "ensure"]

[[events]]
on = "pane.created"
command = ["python3", "monitor.py", "ensure"]

[[events]]
on = "workspace.focused"
command = ["python3", "monitor.py", "ensure"]

# Start with the server so the sidebar is populated right after a restart.
[[startup]]
platforms = ["linux", "macos"]
command = ["python3", "monitor.py", "ensure"]
